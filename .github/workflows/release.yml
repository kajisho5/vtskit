name: Release

# A tag v* (v0.1.0) builds the sdist and the wheel, checks them, attaches
# them to a GitHub release of the tag, and publishes them to PyPI through
# trusted publishing: PyPI must know this repository and workflow as the
# project's publisher (pypi.org, the project's "Publishing" settings:
# owner kajisho5, repository vtskit, workflow release.yml, environment
# pypi) before the first release; until then the PyPI step fails and the
# GitHub release still carries the files.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$tag\"" pyproject.toml || { echo "pyproject.toml is not at $tag"; exit 1; }
          grep -q "^__version__ = \"$tag\"" vtskit/__init__.py || { echo "vtskit/__init__.py is not at $tag"; exit 1; }
      - name: Tests (ffmpeg, dvdauthor and libdvdnav installed; none skipped)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dvdauthor libdvdnav4
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee tests.log
          ! grep -n "\.\.\. skipped" tests.log
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release of the tag with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "vtskit $GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
