[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vtskit"
version = "0.1.0"
description = "DVD-Video titlesets in pure Python: VOBs, navigation packs and IFO files"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "kajisho5" }]
keywords = ["dvd", "dvd-video", "ifo", "vob", "authoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/kajisho5/vtskit"

[tool.setuptools]
packages = ["vtskit"]
